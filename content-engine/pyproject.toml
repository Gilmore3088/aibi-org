[project]
name = "aibi-content-engine"
version = "0.1.0"
description = "AiBI Scout: nightly AI content ingestion and scoring for The AI Banking Institute."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "supabase>=2.0.0",
    "feedparser>=6.0.0",
    "pydantic-settings>=2.0.0",
    "modal>=0.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

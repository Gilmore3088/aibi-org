name: E2E

on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Base URL to run against (defaults to local build)'
        required: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# All jobs build and serve the PR's own code on localhost:3000 instead of
# polling a Vercel preview URL. Vercel Deployment Protection 401s
# unauthenticated requests so wait-for-vercel-preview times out. Same fix
# as the Lighthouse workflow (PR #118, commit 1b6b525). See issue #119.

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
      - name: Start server
        env:
          NEXT_TELEMETRY_DISABLED: 1
          PORT: 3000
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "Server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          cat server.log
          exit 1
      - name: Run smoke tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.target_url || 'http://localhost:3000' }}
        run: npx playwright test e2e/smoke.spec.ts --project=chromium
      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 7

  a11y:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
      - name: Start server
        env:
          NEXT_TELEMETRY_DISABLED: 1
          PORT: 3000
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "Server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          cat server.log
          exit 1
      - name: Run a11y tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.target_url || 'http://localhost:3000' }}
        run: npx playwright test e2e/a11y.spec.ts --project=chromium
      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-a11y-report
          path: playwright-report/
          retention-days: 7

  auth:
    name: Auth flow tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: smoke
    # Auth tests require Supabase service-role access to seed/cleanup
    # users. Skip on forks (secrets unavailable) AND on repos where the
    # operator hasn't configured the SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY
    # secrets yet — seed helpers throw without them, which surfaces as a
    # red lane that nobody can fix in code. When the secrets are missing,
    # mark the lane as "skipped" rather than failing.
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.E2E_AUTH_TESTS_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Start server
        env:
          NEXT_TELEMETRY_DISABLED: 1
          PORT: 3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "Server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          cat server.log
          exit 1
      - name: Run auth tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.target_url || 'http://localhost:3000' }}
          # No staging Supabase project — auth tests seed against the
          # real project with .test TLD emails. See e2e/README.md.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ALLOW_PRODUCTION_SUPABASE: 'true'
        run: npx playwright test e2e/auth.spec.ts
      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-auth-report
          path: playwright-report/
          retention-days: 7

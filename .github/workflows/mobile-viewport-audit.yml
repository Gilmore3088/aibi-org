name: Mobile viewport audit

on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# Runs e2e/mobile-viewport-audit.spec.ts on every PR. The spec visits
# ~18 public routes at three mobile widths (375 / 390 / 414 px) and asserts
# no horizontal overflow at each width.
#
# The full matrix (22 public routes × 3 mobile widths) is green, so this
# check is BLOCKING: a horizontal-overflow regression on any audited route
# fails the PR. Screenshots + the failure list still land in the
# `mobile-viewport-screenshots` artifact for inspection. (During the initial
# rollout the test step was `continue-on-error: true` / advisory; it was
# flipped to blocking once the matrix went green — the documented trigger.)
#
# See #194 for the foundational mobile responsiveness sweep + audit
# methodology decision.

concurrency:
  group: mobile-viewport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Mobile viewport overflow check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
      - name: Start server
        env:
          NEXT_TELEMETRY_DISABLED: 1
          PORT: 3000
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "Server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          cat server.log
          exit 1
      - name: Run mobile viewport audit
        # Blocking: the matrix is green, so any horizontal-overflow regression
        # fails the PR. See #194 for the rollout plan.
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test e2e/mobile-viewport-audit.spec.ts --project=chromium --reporter=list
      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi
      - name: Upload screenshots + report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-viewport-screenshots
          path: |
            test-results/mobile-viewport/
            playwright-report/
          retention-days: 14

      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&amp;family=Inter:wght@500;600&amp;display=swap');
      .wm{font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;font-weight:600;font-size:58px;letter-spacing:-1px;fill:#F1EFE7;}
      .bk{fill:#C8A24A;font-weight:500;}
      .gi{font-family:'Instrument Serif','Times New Roman',Georgia,serif;font-style:italic;font-weight:400;font-size:66px;fill:#F1EFE7;}
